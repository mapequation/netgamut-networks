name: Mirror

# Builds the web mirror on the `mirror` branch: Netzschleuder, KONECT and SNAP
# networks as gzipped Pajek files, plus the index.json manifest that the netgamut
# explorer and the Network Navigator read. One pass takes all three sources in
# one size order, smallest first, so a file that is pushed is not deleted again
# to make room for a smaller one. `netgamut export-networks` updates the
# checkout in place and downloads a network again only when its catalog entry
# changed, so a month without upstream changes commits nothing.
#
# The build runs in slices of 45 minutes, each pushed before the next starts,
# so reaching the job's time limit loses nothing. A run that stops with
# networks still to build starts the next run itself.
on:
  schedule:
    # The 8th, so netgamut's monthly catalog refresh has had a week to merge.
    - cron: "0 3 8 * *"
  workflow_dispatch:
    inputs:
      netgamut:
        description: netgamut branch, tag or commit to build with
        default: main

permissions:
  contents: write
  actions: write # to start the next run when this one runs out of time

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NETGAMUT_REF: ${{ inputs.netgamut || 'main' }}
    steps:
      # The checkout holds the whole mirror (up to 4 GB, twice with .git), and a
      # conversion needs room for one large network besides.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
        with:
          path: main

      - uses: actions/checkout@v7
        with:
          ref: mirror
          path: mirror

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: Configure git
        working-directory: mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build in slices
        id: build
        run: |
          # No new slice after 4 h 45 min: the last one then has time to finish
          # its network, push, and still end inside the job's limit.
          last_start=$((SECONDS + 285 * 60))
          while :; do
            uvx --from "git+https://github.com/mapequation/netgamut@$NETGAMUT_REF" \
              netgamut export-networks --output mirror --clear-cache --stop-after 45
            # A push that fails even after its retries stays committed, and the
            # next slice's push takes it along; only the last one must succeed.
            if (cd mirror && ../main/scripts/push-in-batches.sh "Build the mirror"); then
              pushed=true
            else
              pushed=false
              echo "::warning::Push failed; the next slice pushes again"
            fi
            complete=$(jq -r .complete mirror/index.json)
            if [[ $complete == true ]] || ((SECONDS > last_start)); then
              echo "complete=$complete" >>"$GITHUB_OUTPUT"
              break
            fi
          done
          [[ $pushed == true ]]

      - name: Start the next run
        if: steps.build.outputs.complete == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mirror.yml --repo "$GITHUB_REPOSITORY" --ref main -f netgamut="$NETGAMUT_REF"

      # A network that failed through a fault in netgamut keeps its previous
      # file, or none, and is listed under `failed`. Its run turns red here,
      # after what did build is pushed and the next run is started.
      - name: Fail on netgamut errors
        run: |
          jq -r '(.failed // [])[] | "::error title=\(.key)::\(.reason)"' mirror/index.json
          failed=$(jq '(.failed // []) | length' mirror/index.json)
          ((failed == 0))
